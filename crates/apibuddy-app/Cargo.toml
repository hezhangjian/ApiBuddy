[package]
name = "apibuddy-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "apibuddy-app"
path = "src/main.rs"

[features]
default = []
cli-integration = []

[dependencies]
regex.workspace = true
url.workspace = true
# NSH 0.4's watcher discovers explicit path dependencies, not workspace inheritance.
apibuddy-core = { path = "../apibuddy-core" }
nsh-core.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { workspace = true, features = ["js"] }
