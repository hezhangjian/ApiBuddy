[package]
name = "apibuddy-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "apibuddy-app"
path = "src/main.rs"

[features]
default = []
cli-integration = []

[dependencies]
apibuddy-core.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
